[project]
name = "datapipe-workspace"
version = "0"
requires-python = ">=3.10,<3.15"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*"]

[tool.ruff]
line-length = 120
extend-exclude = ["*.ipynb"]
force-exclude = true

[tool.ruff.lint]
ignore = ["PLR0402", "C408"]

[tool.mypy]
ignore_missing_imports = true
follow_imports = "silent"
namespace_packages = true
