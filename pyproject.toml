[project]
name = "datapipe-workspace"
version = "0"
requires-python = ">=3.10,<3.15"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*"]

[tool.ruff]
line-length = 120

[tool.mypy]
ignore_missing_imports = true
follow_imports = "silent"
namespace_packages = true

[dependency-groups]
dev = ["ty>=0.0.65"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["libs"]
