[project]
name = "datapipe-app-example"
version = "0"
description = "Minimal Datapipe App example with /api/v1alpha3 (SQLite, Alembic; no runs/logs)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "alembic",
    "datapipe-app",
    "datapipe-core[sqlite]",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest<8",
]

[tool.uv.sources]
datapipe-app = { path = "../../libs/datapipe-app", editable = true }
datapipe-core = { path = "../../libs/datapipe-core", editable = true }
