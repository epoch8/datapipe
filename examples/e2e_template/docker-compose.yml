services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # minio/minio and minio/mc are gone from Docker Hub (both repos now 404
  # from Hub's API), so this uses RustFS <https://github.com/rustfs/rustfs>,
  # an S3-compatible object store, plus the AWS CLI in place of `mc`.
  # RUSTFS_ACCESS_KEY/RUSTFS_SECRET_KEY set the same root credential
  # MINIO_ROOT_USER/MINIO_ROOT_PASSWORD did, so AWS_ACCESS_KEY_ID/
  # AWS_SECRET_ACCESS_KEY elsewhere (label-studio, seed_sample_data.py) are
  # unchanged.
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.6
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # `mc mb --ignore-existing` + `mc anonymous set download` equivalent: create
  # the bucket (rustfs treats a pre-existing bucket as success, so this is
  # already idempotent) and grant anonymous s3:GetObject — the "download"
  # preset grants read without list, matching mc's policy.
  rustfs-init:
    image: amazon/aws-cli:latest
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://rustfs:9000 s3 mb s3://datapipe-e2e &&
      aws --endpoint-url http://rustfs:9000 s3api put-bucket-policy --bucket datapipe-e2e --policy '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"*\"]},\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::datapipe-e2e/*\"]}]}'
      "

  label-studio:
    image: heartexlabs/label-studio:1.22.0
    ports:
      - "8080:8080"
    environment:
      DJANGO_DB: default
      POSTGRE_NAME: postgres
      POSTGRE_USER: postgres
      POSTGRE_PASSWORD: password
      POSTGRE_PORT: 5432
      POSTGRE_HOST: postgres
      LABEL_STUDIO_ENABLE_LEGACY_API_TOKEN: "true"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
