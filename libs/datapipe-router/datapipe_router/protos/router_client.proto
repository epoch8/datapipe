syntax = "proto3";

package datapipe;


service RouterClientService {
  rpc GetAgents(GetAgentsRequest) returns (GetAgentsResponse);
  rpc GetGraph(GetGraphRequest) returns (GetGraphResponse);
  rpc GetData(GetDataRequest) returns (GetDataResponse);
  rpc RunPipeline(RunPipelineRequest) returns (RunPipelineResponse);
  rpc CancelPipeline(CancelPipelineRequest) returns (CancelPipelineResponse);
}

message GetAgentsRequest {

}

message GetAgentsResponse {
    repeated string agents = 1;
}

message GetDataRequest {
    string agent_id = 1;
    string table = 2;
    int64 page = 3;
    int64 page_size = 4;
    string order = 5;
    bool include_total = 6;
    optional string order_by = 7;
    bytes filters = 8;
    repeated bytes focus = 9;
}

message TableData {
    int64 page = 1;
    int64 page_size = 2;
    bytes data = 3;
    optional int64 total = 4;
}

message GetDataResponse {
    TableData data = 1;
}

message GetGraphRequest {
    string agent_id = 1;
    string label_key = 2;
    string value = 3;
}

message TableColumn {
    string name = 1;
    string type = 2;
}

message TableDetails {
    string name = 1;
    string store_class = 2;
    repeated string indexes = 3;
    repeated TableColumn schema = 4;
    optional int64 size = 5;
}

message LabelsItem {
    repeated string item = 1;
}

message PipelineStepDetail {
    string name = 1;
    string type = 2;
    string transform_type = 3;
    repeated string inputs = 4;
    repeated string outputs = 5;
    repeated LabelsItem labels = 6;
    bool has_transform_meta = 7;
    repeated string indexes = 8;
    optional int64 total_idx_count = 9;
    optional int64 changed_idx_count = 10;
}

message MetaStepDetail {
    string name = 1;
    string type = 2;
    string transform_type = 3;
    repeated string inputs = 4;
    repeated string outputs = 5;
    repeated LabelsItem labels = 6;
    GetGraphResponse graph = 7;
}

message PipelineNodeDetails {
    oneof details {
        PipelineStepDetail pipeline_step = 1;
        MetaStepDetail meta_step = 2;
    }
}

message GraphData {
    map<string, TableDetails> catalog = 1;
    repeated PipelineNodeDetails pipeline = 2;
    repeated string stages = 3;
}

message GetGraphResponse {
    GraphData data = 1;
}

message ChangeList {
    string table = 1;
    bytes index = 2;
}

message RunPipelineRequest {
    string agent_id = 1;
    string run_id = 2;
    repeated LabelsItem labels = 3;
    repeated ChangeList changelist = 4;
}

message RunPipelineResponse {
    string run_id = 1; 
    string status = 2;
    string error = 3;
}

message CancelPipelineRequest {
    string agent_id = 1;
    string run_id = 2;
}

message CancelPipelineResponse {
    string run_id = 1; 
    string status = 2;
    string error = 3;
}
