name: datapipe-ml

on:
  push:
    branches:
      - "master"
      - "v**"
    paths:
      - ".github/workflows/lib-datapipe-ml.yml"
      - "libs/datapipe-core/**"
      - "libs/datapipe-ml/**"
      - "pyproject.toml"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/lib-datapipe-ml.yml"
      - "libs/datapipe-core/**"
      - "libs/datapipe-ml/**"
      - "pyproject.toml"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies with uv
        run: |
          uv sync --directory libs/datapipe-ml --all-extras

      - name: Lint with flake8
        run: |
          uv run flake8 --version
          uv run flake8 libs/datapipe-ml/datapipe_ml --count --select=E9,F63,F7,F82 --show-source --statistics
          uv run flake8 libs/datapipe-ml/datapipe_ml --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Lint with mypy
        working-directory: libs/datapipe-ml
        run: |
          uv run mypy --version
          uv run mypy --config-file mypy-config.toml -p datapipe_ml --ignore-missing-imports --follow-imports=silent --check-untyped-defs

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.12"]
        test-db-env: ["sqlite"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies with uv
        run: |
          uv pip install --system -e "libs/datapipe-ml[sqlite]" "pytest<8" "pytest-cases"

      - name: Test with pytest
        run: |
          pytest libs/datapipe-ml/tests -m "not training and not slow and not e2e and not e2e_examples and not service_e2e and not cloud_storage and not tensorflow and not torch and not fiftyone"
        env:
          TEST_DB_ENV: ${{ matrix.test-db-env }}

  test-fiftyone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongodb:
        image: mongo:7
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies with uv
        run: |
          uv pip install --system -e "libs/datapipe-ml[fiftyone,sqlite]" "pytest<8" "pytest-cases"

      - name: Test FiftyOne extra with pytest
        run: |
          python -m pytest libs/datapipe-ml/tests/test_utils_image_data_stores.py -m "fiftyone"
        env:
          TEST_DB_ENV: sqlite
          FIFTYONE_DATABASE_URI: mongodb://localhost:27017

