# Hand-maintained map: public symbol name → mdBook page under docs/source/.
# Used by docs/scripts/inventory_core.py. Add a row when a new pipe surface lands.
#
# Coverage rule (CI --strict): every inventoried symbol must have an existing page.
# Stub / "Needs review" pages still count as covered until --fail-on-stubs is enabled.

symbols:
