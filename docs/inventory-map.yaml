  "pipeline:run_changelist": reference/pipeline-catalog.md
  run_steps_changelist: reference/pipeline-catalog.md
  DataTable: reference/table.md
  DataStore: reference/table.md

  # Types
  Required: reference/types.md
  InputSpec: reference/types.md
  OutputSpec: reference/types.md
  ChangeList: reference/types.md

  # Core pipeline steps
  BatchTransform: reference/steps/batch-transform.md
  DatatableBatchTransform: reference/steps/batch-transform.md
  BatchGenerate: reference/steps/batch-generate.md
  UpdateExternalTable: reference/steps/update-external-table.md
  DatatableTransform: reference/steps/datatable-transform.md

